name: Delivery Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Enforce minimal top-level permissions (least privilege)
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ============================================================================
  # Quality Gate: Frontend Validation
  # ============================================================================
  validate-frontend:
    name: Frontend Quality & Build Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Run frontend linter
        run: npm run lint

      - name: Run frontend typecheck
        run: npm run typecheck

      - name: Build frontend production bundle
        run: npm run build

  # ============================================================================
  # Quality Gate: Backend Validation
  # ============================================================================
  validate-backend:
    name: Backend Quality, Tests & Build Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Run backend automated tests
        working-directory: backend
        run: npm test

      - name: Run backend linter
        working-directory: backend
        run: npm run lint

      - name: Run backend typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Compile backend TypeScript to JavaScript
        working-directory: backend
        run: npm run build

  # ============================================================================
  # PR Validation: Docker Container Build Verification (Zero Cloud Credentials)
  # ============================================================================
  validate-docker:
    name: Docker Build Validation (PR)
    if: github.event_name == 'pull_request'
    needs:
      - validate-frontend
      - validate-backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build production frontend image (verification only)
        run: docker build -t investment-committee-frontend:pr-test .

      - name: Build backend image (verification only)
        run: docker build -t investment-committee-backend:pr-test ./backend

  # ============================================================================
  # Delivery: Build, Tag with Git SHA, and Publish to Amazon ECR
  # Runs ONLY on trusted pushes to main after all quality gates pass
  # ============================================================================
  publish-ecr:
    name: Build & Publish to Amazon ECR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - validate-frontend
      - validate-backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # Required for requesting JWT from GitHub OIDC provider
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'the-investment-committee' }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build Production Container Images (Frontend & Backend)
        run: |
          echo "Building production frontend image from root Dockerfile..."
          docker build \
            --label "org.opencontainers.image.title=The Investment Committee - Frontend" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            -t ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}-frontend .

          echo "Building production backend image from backend/Dockerfile..."
          docker build \
            --label "org.opencontainers.image.title=The Investment Committee - Backend" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            -t ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}-backend ./backend

      - name: Configure AWS Credentials (OIDC Only)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Tag and Push Container Images to Amazon ECR
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          FRONTEND_IMAGE="$REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}-frontend"
          BACKEND_IMAGE="$REGISTRY/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}-backend"

          echo "Tagging frontend image: $FRONTEND_IMAGE"
          docker tag ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}-frontend "$FRONTEND_IMAGE"
          echo "Pushing frontend image to Amazon ECR..."
          docker push "$FRONTEND_IMAGE"

          echo "Tagging backend image: $BACKEND_IMAGE"
          docker tag ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}-backend "$BACKEND_IMAGE"
          echo "Pushing backend image to Amazon ECR..."
          docker push "$BACKEND_IMAGE"

      - name: Record Delivery Traceability
        run: |
          echo "=================================================="
          echo "Sprint 5 Delivery Artifact Summary (Dual-Image Architecture)"
          echo "=================================================="
          echo "Commit SHA:         ${{ github.sha }}"
          echo "Frontend Tag:       ${{ env.IMAGE_TAG }}-frontend"
          echo "Backend Tag:        ${{ env.IMAGE_TAG }}-backend"
          echo "Registry:           ${{ steps.login-ecr.outputs.registry }}"
          echo "Target ECR:         ${{ env.ECR_REPOSITORY }}"
          echo "Frontend Canonical: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}-frontend"
          echo "Backend Canonical:  ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}-backend"
          echo "=================================================="
