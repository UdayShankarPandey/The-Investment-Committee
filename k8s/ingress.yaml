apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: investment-committee-ingress
  namespace: investment-committee
  labels:
    app.kubernetes.io/name: the-investment-committee
    app.kubernetes.io/part-of: the-investment-committee
  annotations:
    # Standard Ingress specification; avoid activating billable AWS ALB unless explicitly requested
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/target-type: "ip"
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 3000
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080
